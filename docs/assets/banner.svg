<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">TGBBot — Votre radar immobilier sur Telegram</title>
  <desc id="desc">Bannière violette et cyan avec un radar, une maison et une carte d’annonce fictive.</desc>
  <defs>
