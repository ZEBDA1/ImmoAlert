    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b69bff"/><stop offset="1" stop-color="#6ce7e2"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#24334c"/><stop offset="1" stop-color="#172333"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#8b5cf6" stop-opacity="0.22"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <clipPath id="bounds"><rect width="1280" height="480" rx="28"/></clipPath>
  </defs>
