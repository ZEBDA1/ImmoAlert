      <path d="M84 87l12-10 12 10M87 85v14h18V85M94 99v-8h5v8" fill="none" stroke="url(#accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="135" y="97" fill="#f4f0ff" font-size="32" font-weight="700" letter-spacing="1">TGBBot</text>
