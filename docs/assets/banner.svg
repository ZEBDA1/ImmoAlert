        <rect x="395" y="362" width="142" height="35" rx="17.5" fill="#c2a8ff" fill-opacity="0.08" stroke="#b39bd4" stroke-opacity="0.22"/>
        <text x="417" y="384">Auto-hébergé</text>
      </g>
      <circle cx="79" cy="437" r="3.5" fill="#66ddc3"/>
      <text x="92" y="442" fill="#8491ac" font-size="12" letter-spacing="1">PYTHON / TELEGRAM / DOCKER</text>
      <text x="1196" y="442" text-anchor="end" fill="#7f8fa5" font-size="12">Un projet de ZEBDA</text>
