name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-snapshot:
    name: Public snapshot and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify public files and scan secrets
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$(mktemp -d)"
          scanner="$(mktemp -d)"
          trap 'rm -rf "$snapshot" "$scanner"' EXIT
          git archive HEAD | tar -x -C "$snapshot"
          python3 scripts/check_publication.py --root "$snapshot"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner/gitleaks.tar.gz"
          python3 - "$scanner" <<'PY'
          from pathlib import Path
          import hashlib,sys,tarfile
          root=Path(sys.argv[1]);archive=root/'gitleaks.tar.gz'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          with tarfile.open(archive) as bundle:
              member=bundle.getmember('gitleaks');assert member.isfile()
              (root/'gitleaks').write_bytes(bundle.extractfile(member).read())
          (root/'gitleaks').chmod(0o755)
          PY
          "$scanner/gitleaks" dir "$snapshot" --redact=100 --no-banner --no-color

  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      BOT_TOKEN: "123456:ci-test-token"
      DATABASE_URL: "sqlite://"
      ENABLE_GEOCODING: "false"
      AI_SCAM_ENABLED: "false"
      USE_SELENIUM_FALLBACK: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [tests, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t tgbbot:ci .
      - name: Check application and database without network access
        run: |
          docker run --rm --network none \
            -e BOT_TOKEN=123456:ci-test-token \
            -e DATABASE_URL=sqlite:// \
            tgbbot:ci python -c \
            'import main; from pathlib import Path; from database.session import init_db; from scripts.healthcheck import main as check; init_db(); assert Path("/app/web_dist/index.html").is_file(); raise SystemExit(check())'

  frontend:
    name: Website and Plesk upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frontend dependencies
        run: npm --prefix web ci --no-audit --no-fund
      - name: Check TypeScript and build website
        run: npm --prefix web run build
      - name: Prepare Plesk upload
        run: python3 scripts/package_plesk.py
      - name: Check PHP gateway syntax
        run: |
          docker run --rm -v "$PWD/deploy/plesk:/work:ro" php:8.3-cli-alpine php -l /work/httpdocs/api/index.php
          docker run --rm -v "$PWD/deploy/plesk:/work:ro" php:8.3-cli-alpine php -l /work/private/immoalert.example.php
      - name: Keep the tested upload package
        uses: actions/upload-artifact@v4
        with:
          name: immoalert-plesk
          path: |
            dist/immoalert-plesk.zip
            dist/immoalert-plesk.zip.sha256
          retention-days: 14
