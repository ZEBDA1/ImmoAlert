name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      BOT_TOKEN: "123456:ci-test-token"
      DATABASE_URL: "sqlite://"
      ENABLE_GEOCODING: "false"
      AI_SCAM_ENABLED: "false"
      USE_SELENIUM_FALLBACK: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t tgbbot:ci .
      - name: Check application and database without network access
        run: |
          docker run --rm --network none \
            -e BOT_TOKEN=123456:ci-test-token \
            -e DATABASE_URL=sqlite:// \
            tgbbot:ci python -c \
            'import main; from database.session import init_db; from scripts.healthcheck import main as check; init_db(); raise SystemExit(check())'
